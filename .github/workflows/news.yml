name: AI News Daily

on:
  schedule:
    # 每天早上 9 点（北京时间）自动运行
    # 北京时间 9点 = UTC 1点
    - cron: '0 1 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Fetch AI News
        run: python fetch_news.py

      - name: Generate HTML page
        run: python generate_page.py

      - name: Commit and push
        run: |
          git config --local user.email "bot@ai-news-bot"
          git config --local user.name "AI News Bot"
          git add -A
          git diff --staged --quiet || git commit -m "Update AI News - $(date +'%Y-%m-%d')"
          git push
